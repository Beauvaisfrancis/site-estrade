<svg viewBox="0 0 840 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration : des travailleurs de rue vont à la rencontre des gens dans les sept villes du territoire de Kateri.">
  <defs>
    <path id="ribbon" d="M250 90 C 360 150, 300 250, 430 300 C 560 350, 470 470, 560 540" fill="none"/>
    <clipPath id="scene"><rect x="0" y="0" width="840" height="720" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#scene)">
    <!-- fond -->
    <rect x="0" y="0" width="840" height="720" fill="#EDEDF0"/>

    <!-- quartier : silhouettes de maisons -->
    <g>
      <rect x="0" y="70" width="70" height="120" fill="#3A3A40"/>
      <rect x="18" y="92" width="14" height="16" fill="#EDEDF0"/><rect x="42" y="92" width="14" height="16" fill="#EE5B29"/><rect x="18" y="122" width="14" height="16" fill="#EDEDF0"/><rect x="42" y="122" width="14" height="16" fill="#EDEDF0"/>
      <path d="M78 190 V96 L118 70 L158 96 V190 Z" fill="#2B2B2E"/>
      <rect x="98" y="112" width="18" height="20" fill="#EE5B29"/><rect x="124" y="112" width="18" height="20" fill="#EDEDF0"/>
      <rect x="168" y="84" width="66" height="106" fill="#52525A"/>
      <rect x="184" y="104" width="14" height="16" fill="#EDEDF0"/><rect x="206" y="104" width="14" height="16" fill="#EDEDF0"/><rect x="184" y="132" width="14" height="16" fill="#EDEDF0"/><rect x="206" y="132" width="14" height="16" fill="#EE5B29"/>
      <path d="M600 190 V92 L640 66 L680 92 V190 Z" fill="#3A3A40"/>
      <rect x="620" y="108" width="18" height="20" fill="#EDEDF0"/><rect x="646" y="108" width="18" height="20" fill="#EE5B29"/>
      <rect x="690" y="78" width="72" height="112" fill="#2B2B2E"/>
      <rect x="708" y="98" width="16" height="18" fill="#EE5B29"/><rect x="732" y="98" width="16" height="18" fill="#EDEDF0"/><rect x="708" y="126" width="16" height="18" fill="#EDEDF0"/><rect x="732" y="126" width="16" height="18" fill="#EDEDF0"/>
      <rect x="772" y="94" width="68" height="96" fill="#52525A"/>
      <rect x="790" y="112" width="14" height="16" fill="#EDEDF0"/><rect x="812" y="112" width="14" height="16" fill="#EE5B29"/>
    </g>
    <!-- sol -->
    <rect x="0" y="188" width="840" height="6" fill="#D9D9DE"/>

    <!-- pins du territoire -->
    <g fill="#52525A">
      <g transform="translate(120,300)"><path d="M0 -30 C 11,-30 18,-22 18,-13 C 18,-1 7,7 0,18 C -7,7 -18,-1 -18,-13 C -18,-22 -11,-30 0,-30 Z"/><circle cx="0" cy="-13" r="6" fill="#EDEDF0"/></g>
      <g transform="translate(700,320)"><path d="M0 -30 C 11,-30 18,-22 18,-13 C 18,-1 7,7 0,18 C -7,7 -18,-1 -18,-13 C -18,-22 -11,-30 0,-30 Z"/><circle cx="0" cy="-13" r="6" fill="#EDEDF0"/></g>
      <g transform="translate(255,585)" fill="#EE5B29"><path d="M0 -30 C 11,-30 18,-22 18,-13 C 18,-1 7,7 0,18 C -7,7 -18,-1 -18,-13 C -18,-22 -11,-30 0,-30 Z"/><circle cx="0" cy="-13" r="6" fill="#fff"/></g>
      <g transform="translate(180,470)"><path d="M0 -24 C 9,-24 14,-18 14,-10 C 14,-1 6,6 0,14 C -6,6 -14,-1 -14,-10 C -14,-18 -9,-24 0,-24 Z"/><circle cx="0" cy="-10" r="5" fill="#EDEDF0"/></g>
    </g>

    <!-- ruban : le pont entre la rue et les ressources -->
    <use href="#ribbon" stroke="#EE5B29" stroke-width="30" stroke-linecap="round"/>
    <text font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#fff">
      <textPath href="#ribbon" startOffset="6"> ON VA VERS LES GENS · LÀ OÙ ILS SONT · </textPath>
    </text>

    <!-- téléphone avec carte du territoire -->
    <g transform="rotate(-10 380 430)">
      <rect x="316" y="330" width="150" height="250" rx="22" fill="#2B2B2E"/>
      <rect x="330" y="352" width="122" height="200" rx="8" fill="#fff"/>
      <path d="M356 386 q 42 -16 66 10 q 20 32 -8 56 q -20 24 -50 18 q -28 -12 -24 -46 q 0 -28 16 -38 Z" fill="#E6E6EA"/>
      <path d="M366 404 q 30 22 50 58" stroke="#EE5B29" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 7"/>
      <g transform="translate(380,406)" fill="#2B2B2E"><path d="M0 -13 C 5,-13 8,-9 8,-5 C 8,1 3,4 0,9 C -3,4 -8,1 -8,-5 C -8,-9 -5,-13 0,-13 Z"/><circle cx="0" cy="-5" r="2.6" fill="#fff"/></g>
      <g transform="translate(410,452)" fill="#EE5B29"><path d="M0 -13 C 5,-13 8,-9 8,-5 C 8,1 3,4 0,9 C -3,4 -8,1 -8,-5 C -8,-9 -5,-13 0,-13 Z"/><circle cx="0" cy="-5" r="2.6" fill="#fff"/></g>
      <circle cx="391" cy="566" r="6" fill="#EE5B29"/>
    </g>

    <!-- figure gauche : travailleur de rue avec sac à dos, salue -->
    <g transform="translate(120,406)">
      <rect x="-34" y="30" width="40" height="70" rx="18" fill="#52525A"/>            <!-- sac à dos -->
      <rect x="6" y="86" width="18" height="60" rx="9" fill="#2B2B2E"/><rect x="34" y="86" width="18" height="60" rx="9" fill="#2B2B2E"/> <!-- jambes -->
      <path d="M2 32 q 26 -14 52 0 l 4 60 q -30 12 -60 0 Z" fill="#3A3A40"/>          <!-- torse -->
      <path d="M12 34 q 16 -8 32 0 l 2 42 q -18 8 -36 0 Z" fill="#EE5B29"/>            <!-- veste orange -->
      <path d="M28 44 l 6 8 l -6 8 l -6 -8 Z" fill="#fff"/>                             <!-- coeur/losange -->
      <rect x="-2" y="34" width="16" height="50" rx="8" fill="#3A3A40" transform="rotate(12 6 60)"/> <!-- bras bas -->
      <rect x="44" y="-18" width="15" height="52" rx="7.5" fill="#3A3A40" transform="rotate(28 50 8)"/> <!-- bras levé -->
      <circle cx="28" cy="14" r="19" fill="#2B2B2E"/>                                   <!-- tête -->
      <path d="M20 16 q 8 8 16 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- figure droite : intervenant tend la main -->
    <g transform="translate(690,360)">
      <rect x="-6" y="30" width="40" height="66" rx="18" fill="#EE5B29"/>             <!-- sac à dos orange -->
      <rect x="-18" y="88" width="18" height="60" rx="9" fill="#2B2B2E"/><rect x="10" y="88" width="18" height="60" rx="9" fill="#2B2B2E"/>
      <path d="M-24 32 q 26 -14 52 0 l 4 58 q -30 12 -60 0 Z" fill="#3A3A40"/>
      <path d="M-14 34 q 16 -8 32 0 l 2 40 q -18 8 -36 0 Z" fill="#52525A"/>
      <path d="M2 44 l 6 8 l -6 8 l -6 -8 Z" fill="#EE5B29"/>
      <rect x="-44" y="40" width="15" height="46" rx="7.5" fill="#3A3A40" transform="rotate(-46 -36 60)"/> <!-- bras tendu -->
      <rect x="18" y="40" width="15" height="50" rx="7.5" fill="#3A3A40" transform="rotate(10 24 62)"/>
      <circle cx="2" cy="14" r="19" fill="#2B2B2E"/>
      <path d="M-6 16 q 8 8 16 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- personne rejointe : assise, reçoit la main tendue -->
    <g transform="translate(600,470)">
      <rect x="-10" y="40" width="60" height="20" rx="10" fill="#2B2B2E"/>            <!-- jambes assises -->
      <path d="M0 4 q 20 -12 40 0 l 4 40 q -24 10 -48 0 Z" fill="#52525A"/>
      <rect x="-16" y="6" width="14" height="40" rx="7" fill="#52525A" transform="rotate(-30 -9 26)"/> <!-- bras qui se lève -->
      <circle cx="20" cy="-12" r="17" fill="#3A3A40"/>
      <path d="M13 -12 q 7 7 14 0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- petits accents -->
    <path d="M470 150 l 7 10 l -7 10 l -7 -10 Z" fill="#EE5B29" opacity=".9"/>
    <circle cx="300" cy="560" r="7" fill="#EE5B29"/>
    <path d="M745 430 v18 M736 439 h18" stroke="#52525A" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

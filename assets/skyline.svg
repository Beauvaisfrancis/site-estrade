<svg viewBox="0 0 1240 190" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Illustration : le quartier du territoire de Kateri.">
  <!-- sol / sentier pointillé -->
  <path d="M0 168 H1240" stroke="#2B2B2E" stroke-opacity=".14" stroke-width="2" stroke-dasharray="1 12" stroke-linecap="round"/>

  <!-- petits monticules -->
  <path d="M120 168 q90 -30 190 0 Z" fill="#2B2B2E" fill-opacity=".05"/>
  <path d="M760 168 q80 -26 170 0 Z" fill="#2B2B2E" fill-opacity=".05"/>

  <!-- arbres nus -->
  <g stroke="#2B2B2E" stroke-width="4.5" stroke-linecap="round">
    <path d="M250 168 V96 M250 120 l-16 -16 M250 118 l16 -18 M250 104 l-12 -14 M250 104 l14 -14"/>
    <path d="M690 168 V104 M690 128 l-14 -14 M690 126 l15 -16 M690 112 l-11 -12"/>
    <path d="M1015 168 V92 M1015 118 l-16 -16 M1015 116 l17 -18 M1015 102 l-12 -14 M1015 102 l14 -14"/>
  </g>

  <!-- maisons -->
  <g>
    <!-- maison 1 -->
    <path d="M60 168 V116 L104 88 L148 116 V168 Z" fill="#2B2B2E"/>
    <rect x="76" y="124" width="16" height="18" fill="#F4F4F5"/><rect x="116" y="124" width="16" height="18" fill="#EE5B29"/>
    <!-- maison 2 (basse, ardoise) -->
    <rect x="330" y="118" width="96" height="50" fill="#52525A"/>
    <rect x="346" y="130" width="15" height="16" fill="#F4F4F5"/><rect x="371" y="130" width="15" height="16" fill="#F4F4F5"/><rect x="396" y="130" width="15" height="16" fill="#EE5B29"/>
    <!-- maison 3 -->
    <path d="M540 168 V110 L590 80 L640 110 V168 Z" fill="#2B2B2E"/>
    <rect x="560" y="120" width="18" height="20" fill="#EE5B29"/><rect x="602" y="120" width="18" height="20" fill="#F4F4F5"/>
    <!-- maison 4 (basse) -->
    <rect x="800" y="122" width="104" height="46" fill="#2B2B2E"/>
    <rect x="818" y="134" width="16" height="16" fill="#F4F4F5"/><rect x="844" y="134" width="16" height="16" fill="#F4F4F5"/><rect x="870" y="134" width="16" height="16" fill="#F4F4F5"/>
    <!-- maison 5 -->
    <path d="M980 168 V114 L1024 86 L1068 114 V168 Z" fill="#52525A"/>
    <rect x="998" y="122" width="16" height="18" fill="#F4F4F5"/><rect x="1036" y="122" width="16" height="18" fill="#EE5B29"/>
  </g>

  <!-- pins -->
  <g>
    <g transform="translate(104,64)"><path d="M0 0 C-8 -14 -15 -19 -15 -28 a15 15 0 1 1 30 0 c0 9 -7 14 -15 28 Z" fill="#EE5B29"/><circle cx="0" cy="-28" r="5.6" fill="#fff"/></g>
    <g transform="translate(590,56)"><path d="M0 0 C-8 -14 -15 -19 -15 -28 a15 15 0 1 1 30 0 c0 9 -7 14 -15 28 Z" fill="#EE5B29"/><circle cx="0" cy="-28" r="5.6" fill="#fff"/></g>
    <g transform="translate(1024,62)"><path d="M0 0 C-8 -14 -15 -19 -15 -28 a15 15 0 1 1 30 0 c0 9 -7 14 -15 28 Z" fill="#EE5B29"/><circle cx="0" cy="-28" r="5.6" fill="#fff"/></g>
  </g>
</svg>
